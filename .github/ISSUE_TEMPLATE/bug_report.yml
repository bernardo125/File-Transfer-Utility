name: Bug report
description: Something does not work as expected (not a security vulnerability)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. **If this is a security problem, stop here and use the private report link on the "New issue" page** (see `SECURITY.md`).
        Logs can contain file names, hashes and IP addresses. Remove anything you do not want to share.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you downloaded (for example v0.1.0), or the commit if you built it from source.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 10/11, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Desktop app, Terminal (--cli)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app on both computers...
        2. ...
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network (for connection problems)
      description: Same Wi-Fi or different networks? Mobile hotspot, VPN, corporate network, IPv6? Did the pairing reach the fingerprint screen?
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
