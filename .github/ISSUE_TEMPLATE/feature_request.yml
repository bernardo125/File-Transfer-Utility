name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [roadmap](https://github.com/bernardo125/File-Transfer-Utility/blob/main/ROADMAP.md) first. Features that change the project principles (direct peer to peer, no relay,
        bounded memory, explicit consent) need a discussion before any work starts.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: security
    attributes:
      label: Does it touch pairing, cryptography, file writing or the network protocol?
      options: ["No", "Yes", "Not sure"]
    validations:
      required: true
