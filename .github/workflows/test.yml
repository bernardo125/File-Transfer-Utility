name: test
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PKGS: ./internal/... ./pkg/cli/... ./tests/...

jobs:
  fast:
    name: fast (vet, format, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l internal pkg/cli)"
      - run: go vet $PKGS
      - run: go test -short -count=1 $PKGS

  frontend-unit:
    name: frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  integration-race:
    name: integration + e2e (race detector)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 -cover $PKGS

  fuzz:
    name: fuzz (bounded)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fuzz FUZZTIME=30s

  vuln:
    name: dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest $PKGS

  e2e-ui:
    name: UI end-to-end (real backends, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: fast
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: |
            frontend/package-lock.json
            tests/ui/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: tests/ui
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: tests/ui
      - run: npm run build:frontend && npx playwright test --project=${{ matrix.browser }}
        working-directory: tests/ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            tests/ui/playwright-report
            tests/ui/test-results

  bench:
    name: benchmarks (informational, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make bench

  # The netem job is intentionally not part of the default pipeline: it needs root and tc.
  netem:
    name: netem (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make netem
